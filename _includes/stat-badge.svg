{%- assign badge_value = include.value | default: '—' -%}
{%- if include.value >= 1000 -%}
  {%- assign badge_value = include.value | divided_by: 1000.0 | round: 1 | append: 'k' -%}
{%- endif -%}
{%- assign value_text = badge_value | append: '' -%}
{%- assign value_width = value_text.size | times: 7 | plus: 10 | at_least: 21 -%}
{%- if include.label == 'stars' -%}{%- assign label_width = 54 -%}{%- else -%}{%- assign label_width = 74 -%}{%- endif -%}
{%- assign badge_width = label_width | plus: value_width -%}
{%- assign value_x = value_width | divided_by: 2.0 | plus: label_width -%}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ badge_width }}" height="20" viewBox="0 0 {{ badge_width }} 20" role="img" aria-label="{{ include.label }}: {{ badge_value }}">
  <title>{{ include.label }}: {{ badge_value }}</title>
  <linearGradient id="shade-{{ include.label }}" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
  <clipPath id="round-{{ include.label }}"><rect data-badge-total="" width="{{ badge_width }}" height="20" rx="3"/></clipPath>
  <g clip-path="url(#round-{{ include.label }})"><rect width="{{ label_width }}" height="20" fill="#f6f6f6"/><rect data-badge-value-background="" x="{{ label_width }}" width="{{ value_width }}" height="20" fill="#9cf"/><rect data-badge-total="" width="{{ badge_width }}" height="20" fill="url(#shade-{{ include.label }})"/></g>
  {% if include.label == 'stars' %}
  <svg x="5" y="3" width="14" height="14" viewBox="0 0 24 24" fill="#333"><path d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
  {% else %}
  <svg x="5" y="3" width="14" height="14" viewBox="0 0 24 24" fill="#4285f4"><path d="M5.242 13.769 0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.748-6.758 4.269ZM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z"/></svg>
  {% endif %}
  <g fill="#333" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="{{ label_width | minus: 21 | divided_by: 2.0 | plus: 21 }}" y="14">{{ include.label }}</text>
    <text data-badge-value="" x="{{ value_x }}" y="14">{{ badge_value }}</text>
  </g>
</svg>
