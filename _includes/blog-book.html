<a class="blog-category" id="{{ include.kind }}" href="{{ include.url | relative_url }}">
  <img class="blog-category-cover" src="{{ include.cover | relative_url }}" alt="" width="{{ include.cover_width }}" height="{{ include.cover_height }}" loading="lazy" decoding="async">
  <span class="blog-category-label">{{ include.title }}<span lang="en">{{ include.title_en }}</span></span>
</a>
