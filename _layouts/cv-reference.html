<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.cv_language == 'zh' %}汤维栋 | 个人简历{% else %}Weidong Tang | Curriculum Vitae{% endif %}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ '/cv/' | absolute_url }}">
  <link rel="alternate" hreflang="zh-CN" href="{{ '/cv/zh/' | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body class="cv-page{% if page.cv_language == 'zh' %} cv-page--zh{% endif %}">
  <a class="skip-link" href="#cv-education">{% if page.cv_language == 'zh' %}跳转到正文{% else %}Skip to content{% endif %}</a>
  <main id="layout-content">{{ content }}</main>
</body>
</html>
