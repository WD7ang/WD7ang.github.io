<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Weidong Tang</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ page.cover | default: '/images/wx.jpg' | absolute_url }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
  <link rel="alternate" type="application/atom+xml" title="Weidong Tang's blog" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</head>
<body class="{{ page.body_class | default: 'academic-page' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="site-name" href="{{ '/' | relative_url }}">Weidong Tang<span class="name-dot">.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" hidden>Menu <span aria-hidden="true">☰</span></button>
      <nav id="primary-navigation" class="primary-navigation" aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}{% if item.title == 'CV' %} class="nav-cv"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="main-content" class="site-main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <span>© {{ site.time | date: '%Y' }} Weidong Tang</span>
    <span>Built with <a href="https://jekyllrb.com/">Jekyll</a> · <a href="https://github.com/WD7ang/wd7ang.github.io">Source</a></span>
    <a href="#main-content">Back to top ↑</a>
  </footer>
</body>
</html>
