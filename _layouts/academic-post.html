---
layout: academic
---
<article class="post-article">
  <header class="page-heading">
    <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← Blog</a></p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time> · Weidong Tang</p>
  </header>
  <div class="post-content">{{ content }}</div>
</article>
